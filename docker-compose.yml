version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend-container
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: >
      gunicorn blog_app.asgi:application
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000

  redis:
    image: redis:7
    container_name: redis-container
    ports:
      - "6379:6379"
